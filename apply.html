<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Bewerbung • TommyZeigt</title>
  <link rel="icon" href="assets/favicon.svg"/>
  <style>
    :root{--bg0:#04060a;--bg2:#0b1020;--stroke:rgba(255,255,255,.10);--card:rgba(255,255,255,.04);--text:#eef2fb;--muted:rgba(238,242,251,.72);--gold:#f2c94c;--gold2:#ffda66;--shadow:0 22px 70px rgba(0,0,0,.55);--r:22px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    body{margin:0;background:linear-gradient(180deg,var(--bg0),var(--bg2));color:var(--text);font-family:inherit}
    .container{max-width:980px;margin:0 auto;padding:28px 18px}
    a{color:inherit;text-decoration:none}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{width:36px;height:36px;border-radius:14px;background:linear-gradient(145deg,var(--gold2),var(--gold));box-shadow:0 10px 30px rgba(242,201,76,.22);position:relative}
    .logo:after{content:"Z";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:950;color:#0a0c10}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);color:var(--text);font-weight:850;cursor:pointer}
    .btn-gold{border:0;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#0a0c10;box-shadow:0 18px 45px rgba(242,201,76,.22)}
    .card{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
    h1{margin:10px 0 10px;font-size:34px;letter-spacing:-.6px}
    p{margin:0 0 10px;color:var(--muted);line-height:1.75}
    .form{display:grid;gap:10px}
    .input{width:100%;padding:12px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03);color:var(--text);outline:none}
    select.input option{background:#0a0c10;color:#eef2fb}
    .small{font-size:12px;color:rgba(238,242,251,.62);line-height:1.5}
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <div style="font-weight:900">TommyZeigt</div>
          <div style="font-size:12px;color:rgba(238,242,251,.62)">Bewerbung</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn" href="index.html">Startseite</a>
        <a class="btn btn-gold" href="https://www.myfxbook.com/portfolio/tommyzeigt/11931259" target="_blank" rel="noopener">Myfxbook</a>
      </div>
    </div>

    <div class="card">
      <h1>Bewerbung</h1>
      <p>Bewerbung ist Pflicht. Danach bekommst du Freigabe und Onboarding per E-Mail.</p>

      <form class="form" method="POST" action="https://formspree.io/f/mkovrqqq">
        <input type="hidden" name="_subject" value="Bewerbung – TommyZeigt" />
        <input type="hidden" name="_redirect" value="apply-thankyou.html" />

        <input class="input" name="name" placeholder="Name" required />
        <input class="input" name="email" type="email" placeholder="E-Mail" required />

        <select class="input" name="investment_level" required>
          <option value="" disabled selected>Investment Stufe auswählen</option>
          <option value="500 Einstieg">500€ – Einstieg</option>
          <option value="1000 Standard">1.000€ – Standard</option>
          <option value="3000 Fortgeschritten">3.000€ – Fortgeschritten</option>
          <option value="5000 Premium">5.000€ – Premium</option>
          <option value="10000 VIP">10.000€+ – VIP</option>
        </select>

        <select class="input" name="experience" required>
          <option value="" disabled selected>Erfahrung auswählen</option>
          <option value="Anfaenger">Anfänger</option>
          <option value="Grundkenntnisse">Grundkenntnisse</option>
          <option value="Erfahren">Erfahren</option>
        </select>

        <select class="input" name="goal" required>
          <option value="" disabled selected>Ziel auswählen</option>
          <option value="Nebenbei">Nebenbei</option>
          <option value="Vermoegensaufbau">Vermögensaufbau</option>
          <option value="Wachstum">Aktives Wachstum</option>
        </select>

        <textarea class="input" name="message" placeholder="Kurz: Was ist dein Ziel & wie viel Zeit hast du?" required></textarea>

        <button class="btn btn-gold" type="submit">Bewerbung senden</button>
        <div class="small">Hinweis: Trading ist mit Risiken verbunden. Vergangene Ergebnisse sind keine Garantie für zukünftige Entwicklungen.</div>
      </form>
    </div>

    <div style="margin-top:14px" class="small">© 2026 TommyZeigt</div>
  </div>
</body>
</html>
