<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support • TommyZeigt Copytrading</title>
  <meta name="description" content="Support & Hilfe – TommyZeigt Copytrading" />
  <link rel="icon" href="assets/favicon.svg" />
  <style>
:root{
  --bg0:#05070a; --bg1:#0b0d12; --text:#e9edf5; --muted:#a7b0c2;
  --gold:#f2c94c; --gold2:#ffda66; --shadow:0 18px 55px rgba(0,0,0,.55);
  --radius:20px; --max:1160px;
  --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:var(--font); color:var(--text);
  background:
    radial-gradient(900px 600px at 10% 0%, rgba(242,201,76,.10), transparent 60%),
    radial-gradient(900px 600px at 90% 10%, rgba(120,170,255,.10), transparent 60%),
    linear-gradient(180deg, var(--bg0), var(--bg1));
}
a{color:inherit;text-decoration:none}
.container{max-width:var(--max); margin:0 auto; padding:0 22px}
.nav{
  position:sticky; top:0; z-index:50;
  backdrop-filter: blur(14px);
  background: rgba(5,7,10,.72);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.nav-inner{display:flex; align-items:center; justify-content:space-between; padding:14px 0; gap:14px}
.brand{display:flex; align-items:center; gap:10px}
.logo{
  width:34px; height:34px; border-radius:12px;
  background: linear-gradient(145deg, rgba(242,201,76,.95), rgba(242,201,76,.55));
  box-shadow: 0 10px 28px rgba(242,201,76,.25);
  position:relative;
}
.logo:after{content:"Z"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; color:#0a0c10}
.brand-text{display:flex; flex-direction:column; line-height:1.1}
.brand-text .top{font-weight:850}
.brand-text .sub{font-size:12px; color:var(--muted)}
.cta{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  padding:11px 14px; border-radius:14px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.04);
  color:var(--text); font-weight:800; font-size:14px;
}
.btn-gold{
  background: linear-gradient(145deg, var(--gold2), var(--gold));
  color:#0a0c10; border:0;
}
.section{padding:46px 0}
.card{
  background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding:18px;
}
.h1{margin:0 0 8px; font-size:34px; font-weight:920; letter-spacing:-.4px}
.p{margin:0 0 16px; color:var(--muted); line-height:1.7}
.form{display:grid; gap:10px}
.input{
  width:100%; padding:12px 12px; border-radius:14px;
  border:1px solid rgba(255,255,255,.10);
  background: rgba(255,255,255,.03);
  color:var(--text); outline:none;
}
textarea.input{min-height:140px; resize:vertical}
.small{font-size:12px; color:rgba(233,237,245,.68); line-height:1.5}
.footer{padding:26px 0 40px; border-top:1px solid rgba(255,255,255,.07); color:rgba(233,237,245,.70); font-size:12px}
  </style>
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div class="brand-text">
          <div class="top">TommyZeigt</div>
          <div class="sub">Support</div>
        </div>
      </div>
      <div class="cta">
        <a class="btn" href="index.html">Zur Startseite</a>
        <a class="btn btn-gold" href="apply.html">Bewerbung</a>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="card">
          <div class="h1">Support</div>
          <div class="p">Schick deine Nachricht. Du bekommst Antwort per E-Mail.</div>

          <form class="form" method="POST" action="https://formspree.io/f/mkovrqqq">
            <input type="hidden" name="_subject" value="Support – TommyZeigt" />
            <input type="hidden" name="_redirect" value="thankyou.html" />

            <input class="input" name="name" placeholder="Name" required />
            <input class="input" name="email" type="email" placeholder="E-Mail" required />
            <textarea class="input" name="message" placeholder="Wobei brauchst du Hilfe?" required></textarea>

            <button class="btn btn-gold" type="submit">Support senden</button>
            <div class="small">Hinweis: Bitte keine sensiblen Daten senden.</div>
          </form>
        </div>
      </div>
    </section>

    <section class="footer">
      <div class="container">© <span id="y"></span> TommyZeigt Copytrading</div>
    </section>
  </main>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
