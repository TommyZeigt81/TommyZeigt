<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support • TommyZeigt Copytrading</title>
  <link rel="icon" href="assets/favicon.svg" />
  <style>
:root{--bg0:#05070a;--bg1:#0b0d12;--text:#e9edf5;--muted:#a7b0c2;--gold:#f2c94c;--gold2:#ffda66;--shadow:0 18px 55px rgba(0,0,0,.55);--radius:20px;--max:980px;--font:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
*{box-sizing:border-box} body{margin:0;font-family:var(--font);color:var(--text);background:radial-gradient(900px 600px at 10% 0%, rgba(242,201,76,.10), transparent 60%),radial-gradient(900px 600px at 90% 10%, rgba(120,170,255,.10), transparent 60%),linear-gradient(180deg,var(--bg0),var(--bg1))}
a{color:inherit;text-decoration:none} .container{max-width:var(--max);margin:0 auto;padding:26px 18px}
.card{background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg, rgba(242,201,76,.95), rgba(242,201,76,.55));position:relative;box-shadow:0 10px 28px rgba(242,201,76,.25)}
.logo:after{content:"Z";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0a0c10}
.h1{margin:6px 0 6px;font-size:28px;letter-spacing:-.3px;font-weight:900}
.p{margin:0 0 14px;color:var(--muted);line-height:1.7}
.form{display:grid;gap:10px}
.input{width:100%;padding:12px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03);color:var(--text);outline:none}
textarea.input{min-height:120px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 14px;border-radius:14px;border:0;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#0a0c10;font-weight:900;cursor:pointer}
.small{font-size:12px;color:rgba(233,237,245,.68);line-height:1.5}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="top">
        <div class="brand">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <div style="font-weight:900">TommyZeigt</div>
            <div style="color:var(--muted);font-size:12px">Support</div>
          </div>
        </div>
        <a href="index.html" style="color:var(--muted);font-size:14px">Zurück</a>
      </div>

      <div class="h1">Support</div>
      <div class="p">Schick deine Nachricht. Du bekommst Antwort per E-Mail.</div>

      <form class="form" method="POST" action="https://formspree.io/f/mkovrqqq">
        <input type="hidden" name="_subject" value="Support – TommyZeigt" />
        <input type="hidden" name="_redirect" value="thankyou.html" />

        <input class="input" name="name" placeholder="Name" required />
        <input class="input" name="email" type="email" placeholder="E-Mail" required />
        <textarea class="input" name="message" placeholder="Wobei brauchst du Hilfe?" required></textarea>
        <button class="btn" type="submit">Support senden</button>
        <div class="small">Hinweis: Bitte keine sensiblen Daten senden.</div>
      </form>
    </div>
  </div>
</body>
</html>
