<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Investor Login • TommyZeigt</title>
<link rel="icon" href="assets/favicon.svg"/>
<style>
:root{--bg:#05070a;--card:rgba(255,255,255,.04);--stroke:rgba(255,255,255,.10);--text:#eef2fb;--muted:rgba(238,242,251,.72);--gold:#f2c94c;--gold2:#ffda66;--shadow:0 22px 70px rgba(0,0,0,.55);--r:22px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
body{margin:0;background:linear-gradient(180deg,#04060a,#0b1020);color:var(--text);font-family:inherit}
.container{max-width:920px;margin:0 auto;padding:28px 18px}
.card{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:14px;background:linear-gradient(145deg,var(--gold2),var(--gold));box-shadow:0 10px 30px rgba(242,201,76,.22);position:relative}
.logo:after{content:"Z";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:950;color:#0a0c10}
h1{margin:12px 0 8px;font-size:34px;letter-spacing:-.6px}
p{margin:0 0 10px;color:var(--muted);line-height:1.75}
.input{width:100%;padding:12px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03);color:var(--text);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);color:var(--text);font-weight:850;cursor:pointer}
.btn-gold{border:0;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#0a0c10;box-shadow:0 18px 45px rgba(242,201,76,.22)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.small{font-size:12px;color:rgba(238,242,251,.62);line-height:1.5}
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <div class="logo" aria-hidden="true"></div>
    <div>
      <div style="font-weight:900">TommyZeigt</div>
      <div style="font-size:12px;color:rgba(238,242,251,.62)">Investor Zone</div>
    </div>
  </div>

  <div style="height:14px"></div>

  <div class="card">
    <h1>Investor Login</h1>
    <p>Dieser Bereich ist für freigeschaltete Investoren. Du erhältst dein Passwort nach Annahme deiner Bewerbung.</p>

    <div style="height:10px"></div>
    <input id="pw" class="input" type="password" placeholder="Passwort eingeben" autocomplete="current-password"/>
    <div style="height:10px"></div>

    <div class="row">
      <button class="btn btn-gold" id="loginBtn" type="button">Einloggen</button>
      <a class="btn" href="index.html">Zur Startseite</a>
    </div>

    <div style="height:10px"></div>
    <div id="msg" class="small"></div>
  </div>

  <div style="margin-top:14px" class="small">© 2026 TommyZeigt</div>
</div>

<script>
(function(){
  // Soft gate: replace with your real password
  const PASSWORD = "TZ-INVESTOR-2026";
  const msg = document.getElementById('msg');
  const pw = document.getElementById('pw');
  const btn = document.getElementById('loginBtn');

  function ok(text){ msg.textContent = text; msg.style.color = "rgba(255,218,102,.95)"; }
  function err(text){ msg.textContent = text; msg.style.color = "rgba(255,140,140,.95)"; }

  btn.addEventListener('click', ()=>{
    const v = (pw.value||"").trim();
    if(!v) return err("Bitte Passwort eingeben.");
    if(v === PASSWORD){
      localStorage.setItem("tz_investor_ok","1");
      ok("Login erfolgreich…");
      location.href = "investor-dashboard.html";
    } else {
      err("Falsches Passwort.");
    }
  });

  pw.addEventListener('keydown', (e)=>{ if(e.key === "Enter") btn.click(); });
})();
</script>
</body>
</html>
